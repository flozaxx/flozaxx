name: Kilit APK

on:
  push:
    paths: ["applock/**", ".github/workflows/applock.yml"]
  workflow_dispatch:

concurrency:
  group: applock-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applock
    env:
      KEYSTORE_BASE64: ${{ secrets.APPLOCK_KEYSTORE_BASE64 }}
      APPLOCK_KEYSTORE_PASSWORD: ${{ secrets.APPLOCK_KEYSTORE_PASSWORD }}
      APPLOCK_KEY_ALIAS: ${{ secrets.APPLOCK_KEY_ALIAS }}
      APPLOCK_KEY_PASSWORD: ${{ secrets.APPLOCK_KEY_PASSWORD }}
      APPLOCK_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Testler
        run: ./gradlew :rules:test :app:testDebugUnitTest

      - name: İmza anahtarını hazırla
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/applock-release.jks"
          echo "APPLOCK_KEYSTORE_FILE=$RUNNER_TEMP/applock-release.jks" >> "$GITHUB_ENV"

      - name: İmzalı release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew :app:assembleRelease

      # Anahtar eklenene kadar derleme kırılmasın; bu APK her seferinde farklı anahtarla imzalanır,
      # üstüne güncelleme yapılamaz.
      - name: Anahtar yok, debug APK
        if: env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::APPLOCK_KEYSTORE_* gizli anahtarları yok; geçici debug APK üretildi."
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: kilit-apk-${{ github.run_number }}
          path: applock/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
