name: İçeriği veritabanına yaz

on:
  push:
    branches: [main]
    paths: ["content/content.json", "tools/content.py", ".github/workflows/content.yml"]
  workflow_dispatch:

concurrency:
  group: site-content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: content/content.json → Firestore site/content
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLOZAXX_A8521 }}
        run: |
          pip install --quiet google-auth requests
          python3 tools/content.py push
