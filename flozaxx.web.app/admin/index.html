<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>flozaxx admin</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=dev">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="https://flozaxx.com/style.css?v=dev">
  <link rel="stylesheet" href="admin.css?v=dev">
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner wrap">
      <button class="icon-btn menu-btn" id="menu-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false" aria-controls="rail-left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="/"><img src="favicon.svg?v=dev" alt="" width="26" height="26"><span>flozaxx<span class="brand-admin">admin</span></span></a>
      <span class="admin-user" id="admin-user"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Temayı değiştir">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout wrap" id="admin-layout">
    <nav class="rail rail-left" id="rail-left" aria-label="Yönetim menüsü"></nav>
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <main class="page-main" id="admin"><p class="muted">Yükleniyor…</p></main>
    <aside class="rail rail-right" id="admin-side" aria-label="Proje bilgileri"></aside>
  </div>

  <div class="admin-savebar" id="savebar" hidden>
    <span id="save-status">Kaydedilmemiş değişiklikler var</span>
    <button type="button" class="btn btn-sm btn-ghost" id="discard">Vazgeç</button>
    <button type="button" class="btn btn-sm btn-primary" id="save">Kaydet ve yayınla</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://flozaxx.com/projects.js?v=dev"></script>
  <script src="https://flozaxx.com/theme.js?v=dev"></script>
  <script src="https://flozaxx.com/site.js?v=dev"></script>
  <script type="module" src="admin.js?v=dev"></script>
</body>
</html>
